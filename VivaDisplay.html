<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIVA Fitness — TV Display</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #353535;
    --panel: #2c2c2c;
    --panel-raised: #404040;
    --teal: #3c6e71;
    --teal-soft: rgba(60,110,113,0.25);
    --gray: #d9d9d9;
    --cream: #fffcf2;
  }

  * { box-sizing: border-box; }

  :root { --scale: 1; }
  :root[data-theme="light"] {
    --bg: #fffcf2;
    --panel: #f2ede0;
    --panel-raised: #e3dccb;
    --teal: #3c6e71;
    --teal-soft: rgba(60,110,113,0.16);
    --gray: #5c584f;
    --cream: #2a2a28;
  }

  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--cream);
    font-family: 'Inter', sans-serif;
    /* Natural page scroll + pinch-zoom for testing in a regular
       phone/laptop browser — previously locked to exactly fill the
       screen, which blocked both. */
    overflow: auto;
  }

  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    padding: 36px 56px 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .date-label {
    font-family: 'IBM Plex Mono', monospace; font-size: calc(15px * var(--scale)); color: var(--teal);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .title-label {
    font-family: 'Oswald', sans-serif; font-size: calc(44px * var(--scale)); font-weight: 600; margin-top: 2px;
  }

  .body-row { display: flex; flex: 1; padding: 10px 56px 24px; gap: 44px; min-height: 0; }

  .rail { width: 230px; position: relative; overflow-y: auto; }
  .rail::before {
    content: ""; position: absolute; left: 10px; top: 12px; bottom: 12px; width: 2px;
    background: var(--panel-raised);
  }

  /* Each rail item is a real focusable button — this is what makes the
     TV remote's d-pad work reliably across different browsers, since
     we react to focus rather than assuming raw keydown reaches us. */
  .rail-item {
    all: unset;
    display: flex; align-items: center; gap: 16px; padding: 14px 6px;
    position: relative; z-index: 1; cursor: pointer; width: 100%;
    border-radius: 10px;
  }
  .rail-item:focus { outline: none; }
  .rail-item:focus .rail-dot,
  .rail-item.active .rail-dot {
    background: var(--teal); border-color: var(--teal);
    box-shadow: 0 0 0 5px var(--teal-soft);
  }
  .rail-dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg); border: 2px solid var(--panel-raised);
    transition: all 0.15s ease;
  }
  .rail-part-num {
    font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--scale)); color: var(--gray);
    opacity: 0.5; text-transform: uppercase;
  }
  .rail-item:focus .rail-part-num,
  .rail-item.active .rail-part-num { color: var(--teal); opacity: 1; }
  .rail-part-title {
    font-family: 'Oswald', sans-serif; font-size: calc(19px * var(--scale)); color: var(--gray); opacity: 0.55;
  }
  .rail-item:focus .rail-part-title,
  .rail-item.active .rail-part-title { color: var(--cream); opacity: 1; }

  .active-panel {
    flex: 1; background: var(--panel); border-radius: 20px; padding: 44px 60px;
    display: flex; flex-direction: column; border: 2px solid var(--teal);
    box-shadow: 0 0 0 6px var(--teal-soft); min-width: 0;
    max-height: calc(100vh - 220px); overflow-y: auto; scroll-behavior: smooth;
  }
  .active-title {
    font-family: 'Oswald', sans-serif; font-size: calc(58px * var(--scale)); font-weight: 700; letter-spacing: 0.01em;
  }
  .active-content {
    font-family: 'Inter', sans-serif; font-size: calc(24.8px * var(--scale)); line-height: 1.6;
    white-space: pre-wrap; margin-top: 26px; flex: 1;
  }

  /* ------------------------------------------------------------------
     MULTI-COLUMN TV LAYOUT (replaces the old single rail+panel view
     above, which is left in place unused rather than risk breaking
     something by deleting it).
  ------------------------------------------------------------------ */
  .columns-row { display: flex; flex: 1; padding: 10px 40px 30px; gap: 24px; min-height: 0; }
  .tv-column {
    flex: 1; min-width: 0; position: relative; background: var(--panel); border-radius: 20px;
    border: 2px solid transparent; padding: 30px 36px; display: flex; flex-direction: column;
  }
  .tv-column.focused { border-color: var(--panel-raised); }
  .tv-column.focused:not(.active) { border-color: var(--teal); }
  .tv-column.active { border-color: var(--teal); box-shadow: 0 0 0 6px var(--teal-soft); }
  .col-content { overflow-y: auto; scroll-behavior: smooth; flex: 1; }
  .col-title {
    font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 0.01em;
    font-size: calc(32px * var(--col-scale, 1));
  }
  .col-body {
    font-family: 'Inter', sans-serif; line-height: 1.6; white-space: pre-wrap; margin-top: 18px;
    font-size: calc(19px * var(--col-scale, 1));
  }
  .col-dots {
    position: absolute; top: 28px; right: 16px; display: flex; flex-direction: column; gap: 7px; z-index: 2;
  }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--panel-raised); }
  .col-dot.filled { background: var(--teal); }

  .picker-screen {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
  }
  .picker-title { font-family: 'Oswald', sans-serif; font-size: 32px; }
  .picker-options { display: flex; gap: 18px; }
  .picker-option {
    width: 90px; height: 90px; border-radius: 18px; background: var(--panel); border: 2px solid var(--panel-raised);
    display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 34px;
  }
  .picker-option.selected { border-color: var(--teal); background: var(--teal-soft); }
  .picker-hint {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--gray); opacity: 0.6;
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 0 30px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    color: var(--gray); opacity: 0.55; text-transform: uppercase; letter-spacing: 0.06em;
    text-align: center;
  }
  .hint-touch { display: none; }

  #theme-toggle-mobile {
    display: none; background: var(--panel); border: 1.5px solid var(--panel-raised);
    color: var(--cream); border-radius: 20px; padding: 8px 14px; font-size: 18px;
    line-height: 1; cursor: pointer;
  }

  /* --------------------------------------------------------------
     MOBILE / PHONE VIEWING
     A TV viewport is always far wider than this, so none of this
     touches the Silk/Fire TV experience — it only applies when the
     page is opened on a phone-sized screen.
  -------------------------------------------------------------- */
  @media (max-width: 820px) {
    header { padding: 20px 20px 8px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .title-label { font-size: 28px; }
    .date-label { font-size: 12px; }
    #theme-toggle-mobile { display: block; position: fixed; top: 16px; right: 16px; z-index: 6; }

    .body-row { flex-direction: column; padding: 10px 20px 20px; gap: 16px; }
    .rail {
      width: 100%; display: flex; gap: 6px; overflow-x: auto; overflow-y: visible;
      -webkit-overflow-scrolling: touch; padding-bottom: 4px;
    }
    .rail::before { display: none; }
    .rail-item {
      flex: 0 0 auto; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 10px 14px; background: var(--panel); border-radius: 12px; border: 1.5px solid transparent;
    }
    .rail-item.active { border-color: var(--teal); background: var(--teal-soft); }
    .rail-dot { display: none; }
    .rail-part-title { font-size: 15px; }

    .active-panel { padding: 24px 22px; max-height: none; border-width: 1.5px; box-shadow: none; }
    .active-title { font-size: 32px; }
    .active-content { font-size: 18px; margin-top: 16px; }

    .hint-remote { display: none; }
    .hint-touch { display: inline; }
    footer { padding: 4px 0 26px; }

    #zoom-toast { display: none; } /* zoom is a remote-only control */
    .empty-state .msg { font-size: 22px; padding: 0 20px; }
    .loading-state { font-size: 20px; }

    /* ---------------------------------------------------------------
       New mobile-only template (buildMobile() in the script below).
       Entirely separate class names from the desktop/TV markup above,
       so nothing here can ever affect that view.
    --------------------------------------------------------------- */
    .mobile-shell { padding: 18px 18px 40px; max-width: 480px; margin: 0 auto; }

    .mobile-topbar { padding-bottom: 14px; }
    .wordmark-mobile { font-family: 'Oswald', sans-serif; font-size: 19px; }
    .wordmark-mobile .accent { font-weight: 400; letter-spacing: 0.12em; color: var(--teal); }

    .week-nav { display: flex; align-items: center; gap: 6px; }
    .week-nav-btn {
      flex: 0 0 auto; background: var(--panel); border: 1px solid var(--panel-raised); color: var(--cream);
      border-radius: 10px; width: 36px; height: 44px; font-size: 18px; cursor: pointer;
    }
    .week-strip { flex: 1; display: flex; justify-content: space-between; gap: 4px; }
    .week-day {
      all: unset; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 2px; border-radius: 12px; cursor: pointer; text-align: center;
    }
    .week-day-label {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray);
      opacity: 0.6; text-transform: uppercase;
    }
    .week-day-num {
      font-family: 'Oswald', sans-serif; font-size: 16px; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
    }
    .week-day.is-today .week-day-num { border: 1.5px solid var(--teal); }
    .week-day.selected .week-day-num { background: var(--teal); color: var(--cream); }
    .week-day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal); }
    .week-day.selected .week-day-dot { background: var(--cream); }

    .mobile-date-caption {
      text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
      color: var(--gray); opacity: 0.65; text-transform: uppercase; letter-spacing: 0.05em;
      margin: 14px 0 6px;
    }

    .mobile-workout-scroll { margin-top: 6px; }
    .mobile-workout-title {
      font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 600; margin-bottom: 18px;
    }
    .mobile-part-title { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; }
    .mobile-part-content {
      font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; white-space: pre-wrap;
      margin-top: 10px; color: var(--cream); opacity: 0.92;
    }
    .mobile-divider { height: 1px; background: var(--panel-raised); margin: 20px 0; }
    .mobile-empty {
      text-align: center; color: var(--gray); opacity: 0.75; font-family: 'Oswald', sans-serif;
      font-size: 19px; padding: 60px 20px;
    }
  }

  #zoom-toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-140%);
    background: var(--teal); color: var(--cream); font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; padding: 8px 18px; border-radius: 20px; letter-spacing: 0.05em;
    opacity: 0; transition: transform 0.25s ease, opacity 0.25s ease; z-index: 20;
    pointer-events: none;
  }
  #zoom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  #sync-status {
    position: fixed; bottom: 10px; right: 16px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; color: var(--gray); opacity: 0.4; letter-spacing: 0.05em;
    text-transform: uppercase; z-index: 5;
  }

  .loading-state {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-size: 28px; color: var(--gray); opacity: 0.7;
  }

  .empty-state {
    height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; text-align: center;
  }
  .empty-state .msg { font-family: 'Oswald', sans-serif; font-size: 34px; color: var(--gray); }
</style>
</head>
<body>
  <div id="app"><div class="loading-state">Loading today's workout…</div></div>
  <div id="zoom-toast"></div>
  <div id="sync-status"></div>
  <button id="theme-toggle-mobile" onclick="toggleTheme()" aria-label="Toggle light/dark mode"></button>

  <!-- Keeps the screen from sleeping: a genuine, small, silent, looping
       video (not a hidden canvas trick). Chromium-based browsers
       specifically decline the "stay awake during video playback"
       exemption for near-invisible/near-zero-size video elements, to
       stop exactly this kind of abuse — so this needs a real, if
       unobtrusive, visible video rather than a 2x2px hidden one. -->

            type="video/mp4">
  </video>

<script>
  // ---------------------------------------------------------------
  // GOOGLE DRIVE CONFIG
  // Fill these in once you have them — see setup instructions.
  //   DRIVE_FILE_ID: the id from the shared link of schedule.json,
  //     e.g. https://drive.google.com/file/d/*THIS_PART*/view
  //   DRIVE_API_KEY: the API key from Google Cloud Console,
  //     restricted to the Drive API + this site.
  // ---------------------------------------------------------------
  const DRIVE_FILE_ID = "1AA38dURLTdFo6s_oFK5StRd89HEUKRx3";
  const DRIVE_API_KEY = "AIzaSyAYWas9QCcsSK7qXJt6Su8L5038vDUjslg";
  const POLL_INTERVAL_MS = 45000; // how often the TV re-checks for changes

  // ---------------------------------------------------------------
  // THEME (dark/light)
  // Persisted per-device via localStorage, so a phone and the gym TV
  // can each keep their own independent choice. Defaults to dark.
  // ---------------------------------------------------------------
  const THEME_KEY = "viva-tv-theme";

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("theme-toggle-mobile");
    if (btn) btn.textContent = theme === "light" ? "🌙" : "☀️";
  }

  function getTheme() {
    try { return localStorage.getItem(THEME_KEY) || "dark"; }
    catch (_) { return "dark"; } // localStorage can be unavailable in rare locked-down browsers
  }

  function toggleTheme() {
    const next = getTheme() === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (_) { /* non-fatal */ }
    applyTheme(next);
    showToast(next === "light" ? "Light mode" : "Dark mode");
  }

  applyTheme(getTheme());

  function driveUrl() {
    return `https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media&key=${DRIVE_API_KEY}`;
  }

  let workout = null;
  let fullSchedule = null; // the whole { workoutsByDate, templates } object — mobile needs this to browse dates; desktop/TV only ever look at "workout" (today), unchanged.
  let lastRawJson = null;

  function setSyncStatus(text) {
    document.getElementById("sync-status").textContent = text;
  }

  async function fetchSchedule() {
    if (DRIVE_FILE_ID === "YOUR_FILE_ID_HERE" || DRIVE_API_KEY === "YOUR_API_KEY_HERE") {
      setSyncStatus("Not connected to Drive yet — showing sample data");
      if (!workout) {
        workout = {
          date: new Date().toISOString().slice(0, 10),
          title: "Sample Session (connect Drive to replace this)",
          parts: [
            { title: "Warm-up", content: "Fill in DRIVE_FILE_ID and DRIVE_API_KEY at the top of this file's <script> to load your real schedule." }
          ]
        };
        fullSchedule = { workoutsByDate: { [todayKey()]: workout }, templates: [] };
        renderForViewport();
      }
      return;
    }

    try {
      setSyncStatus("Updating…");
      const res = await fetch(driveUrl(), { cache: "no-store" });
      const rawText = await res.text();

      if (!res.ok) {
        // Surface Google's actual error message instead of a generic one —
        // this is usually the fastest way to tell what's actually wrong
        // (permissions, bad key, wrong file id, etc).
        let detail = `HTTP ${res.status}`;
        try {
          const errJson = JSON.parse(rawText);
          if (errJson.error && errJson.error.message) detail = errJson.error.message;
        } catch (_) { /* body wasn't JSON, keep the HTTP status */ }
        throw new Error(detail);
      }

      // Skip re-render entirely if nothing changed, so we don't
      // interrupt someone mid-view or reset their scroll/part.
      if (rawText === lastRawJson) {
        setSyncStatus("Synced · " + new Date().toLocaleTimeString());
        return;
      }

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (parseErr) {
        throw new Error("The file's contents aren't valid JSON (" + parseErr.message + ")");
      }

      lastRawJson = rawText;
      fullSchedule = data;
      workout = extractTodaysWorkout(data);
      renderForViewport();
      setSyncStatus("Synced · " + new Date().toLocaleTimeString());
    } catch (err) {
      // Network hiccup or bad config: keep showing whatever we already
      // have loaded rather than blanking the screen on a gym TV.
      setSyncStatus("Couldn't reach schedule — showing last loaded version");
      if (!workout) {
        document.getElementById("app").innerHTML = `
          <div class="empty-state">
            <div class="msg">Couldn't load the schedule.<br><span style="font-size:20px;opacity:0.7;font-family:'IBM Plex Mono',monospace;">${escapeHtml(err.message)}</span></div>
          </div>`;
      }
      console.error("Schedule fetch failed:", err);
    }
  }

  function todayKey() {
    const d = new Date();
    const pad2 = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }

  // The planner writes { workoutsByDate: { "2026-08-28": {...} }, templates: [...] }.
  // Still accepts the older single-workout shape (a bare { date, title, parts })
  // so the file you already have keeps working during the transition.
  function extractTodaysWorkout(data) {
    if (data && data.workoutsByDate) {
      const key = todayKey();
      const w = data.workoutsByDate[key];
      return w ? { date: key, title: w.title, parts: w.parts } : { date: key, title: "", parts: [] };
    }
    return data; // legacy single-workout shape
  }

  function formatFullDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.innerText = str;
    return div.innerHTML;
  }

  // --- Shared date helpers (used by the mobile view below) -------------
  function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
  function toDateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function startOfWeek(d) { return addDays(d, -d.getDay()); } // Sunday-start, matching the reference layout

  // --- Viewport dispatcher ----------------------------------------------
  // Desktop/TV (build, below) is completely unchanged. Mobile gets its
  // own dedicated render path (buildMobile, further down) with a real
  // week picker and the full day's workout stacked and scrollable,
  // rather than the one-part-at-a-time remote-driven carousel.
  function isMobileViewport() {
    return window.matchMedia("(max-width: 820px)").matches;
  }
  function renderForViewport() {
    if (isMobileViewport()) {
      buildMobile();
    } else {
      build();
    }
  }

  // -------------------------------------------------------------------
  // MULTI-COLUMN TV VIEW
  // On first run (per device), asks how many columns (1–4) to show.
  // Each column independently pages through the workout's parts; the
  // focused column shows a dot stack (which piece it's on); pressing
  // OK "activates" the focused column, at which point Left/Right zoom
  // it and Up/Down scroll it, instead of switching columns/pieces.
  // -------------------------------------------------------------------
  function getColumnCount() {
    try {
      const v = parseInt(localStorage.getItem("viva-tv-columns"), 10);
      return v >= 1 && v <= 4 ? v : null;
    } catch (_) { return null; }
  }
  function persistColumnCount(n) {
    try { localStorage.setItem("viva-tv-columns", String(n)); } catch (_) { /* non-fatal */ }
  }

  let columnCount = getColumnCount();
  let columns = [];
  let focusedColumn = 0;
  let pickerSelection = 2;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function showToast(text) {
    const toast = document.getElementById("zoom-toast");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 1200);
  }

  function initColumns() {
    const total = workout.parts.length;
    columns = Array.from({ length: columnCount }, (_, i) => ({
      partIndex: total ? Math.min(i, total - 1) : 0,
      active: false,
      zoom: 1,
    }));
    focusedColumn = 0;
  }

  function currentScrollTops() {
    return columns.map((_, i) => {
      const el = document.getElementById("col-content-" + i);
      return el ? el.scrollTop : 0;
    });
  }
  function restoreScrollTops(tops, skipIndex) {
    columns.forEach((_, i) => {
      if (i === skipIndex) return;
      const el = document.getElementById("col-content-" + i);
      if (el) el.scrollTop = tops[i] || 0;
    });
  }

  function updateHint() {
    const el = document.getElementById("progress-label");
    if (!el) return;
    const col = columns[focusedColumn];
    el.textContent = col && col.active
      ? `←→ zoom (${Math.round(col.zoom * 100)}%) · ↑↓ scroll · OK: done with this column · hold OK: theme`
      : `←→ switch column · ↑↓ change piece · OK: zoom/scroll this column · hold OK: theme`;
  }

  function renderColumns() {
    const app = document.getElementById("app");
    const total = workout.parts.length;

    const colsHtml = columns.map((col, i) => {
      const idx = clamp(col.partIndex, 0, total - 1);
      const p = workout.parts[idx];
      const isFocused = i === focusedColumn;
      const dotsHtml = isFocused ? `
        <div class="col-dots">
          ${workout.parts.map((_, di) => `<div class="col-dot ${di === idx ? "filled" : ""}"></div>`).join("")}
        </div>` : "";
      return `
        <div class="tv-column ${isFocused ? "focused" : ""} ${col.active ? "active" : ""}">
          ${dotsHtml}
          <div class="col-content" id="col-content-${i}" style="--col-scale: ${col.zoom}">
            <div class="col-title">${escapeHtml(p.title)}</div>
            <div class="col-body">${escapeHtml(p.content || "—")}</div>
          </div>
        </div>`;
    }).join("");

    app.innerHTML = `
      <header>
        <div>
          <div class="date-label">${formatFullDate(workout.date)}</div>
          <div class="title-label">${escapeHtml(workout.title || "Today's Session")}</div>
        </div>
      </header>
      <div class="columns-row">${colsHtml}</div>
      <footer id="progress-label"></footer>
    `;
    updateHint();
  }

  function renderPicker() {
    const app = document.getElementById("app");
    const options = [1, 2, 3, 4].map((n) => `
      <div class="picker-option ${n === pickerSelection ? "selected" : ""}">${n}</div>
    `).join("");
    app.innerHTML = `
      <div class="picker-screen">
        <div class="picker-title">How many columns?</div>
        <div class="picker-options">${options}</div>
        <div class="picker-hint">←→ choose · OK to confirm</div>
      </div>
    `;
  }

  function confirmColumnCount(n) {
    columnCount = n;
    persistColumnCount(n);
    initColumns();
    renderColumns();
  }

  function changePiece(colIndex, delta) {
    const total = workout.parts.length;
    const tops = currentScrollTops();
    columns[colIndex].partIndex = clamp(columns[colIndex].partIndex + delta, 0, total - 1);
    renderColumns();
    restoreScrollTops(tops, colIndex); // the changed column intentionally resets to top; others keep their place
  }

  function adjustZoom(colIndex, delta) {
    columns[colIndex].zoom = clamp(columns[colIndex].zoom + delta * 0.15, 0.7, 2.2);
    const el = document.getElementById("col-content-" + colIndex);
    if (el) el.style.setProperty("--col-scale", columns[colIndex].zoom);
    updateHint();
    showToast(`Zoom: ${Math.round(columns[colIndex].zoom * 100)}%`);
  }

  function scrollColumnBy(colIndex, deltaPx) {
    const el = document.getElementById("col-content-" + colIndex);
    if (el) el.scrollBy({ top: deltaPx, behavior: "smooth" });
  }

  function toggleActiveColumn() {
    const col = columns[focusedColumn];
    col.active = !col.active;
    const tops = currentScrollTops();
    renderColumns();
    restoreScrollTops(tops);
    showToast(col.active ? "Zoom / scroll this column" : "Browsing columns");
  }

  function build() {
    const app = document.getElementById("app");

    if (!workout || !workout.parts || workout.parts.length === 0) {
      app.innerHTML = `
        <div class="empty-state">
          <div class="msg">No workout scheduled${workout && workout.date ? " for " + formatFullDate(workout.date) : ""}</div>
        </div>`;
      return;
    }

    if (columnCount === null) {
      renderPicker();
      return;
    }

    if (columns.length !== columnCount) initColumns();
    renderColumns();
  }

  // -----------------------------------------------------------------
  // MOBILE VIEW — a real week picker + the full day's workout stacked
  // and scrollable, matching the reference app layout. Completely
  // separate from build() above; the desktop/TV experience is
  // untouched by anything below this point.
  // -----------------------------------------------------------------
  let mobileSelectedDate = new Date(); // defaults to today

  function getWorkoutForDateKey(key) {
    if (fullSchedule && fullSchedule.workoutsByDate) {
      return fullSchedule.workoutsByDate[key] || null;
    }
    // Legacy single-workout file shape: only "today" has content.
    if (fullSchedule && key === todayKey() && workout) {
      return { title: workout.title, parts: workout.parts };
    }
    return null;
  }

  function buildMobile() {
    const app = document.getElementById("app");
    const weekStart = startOfWeek(mobileSelectedDate);
    const selectedKey = toDateKey(mobileSelectedDate);
    const todaysKey = todayKey();

    const dayCells = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)).map((d) => {
      const key = toDateKey(d);
      const isSelected = key === selectedKey;
      const isToday = key === todaysKey;
      const hasWorkout = !!getWorkoutForDateKey(key);
      return `
        <button class="week-day ${isSelected ? "selected" : ""} ${isToday && !isSelected ? "is-today" : ""}"
                onclick="selectMobileDate('${key}')">
          <span class="week-day-label">${d.toLocaleDateString(undefined, { weekday: "short" })}</span>
          <span class="week-day-num">${d.getDate()}</span>
          ${hasWorkout ? '<span class="week-day-dot"></span>' : ""}
        </button>`;
    }).join("");

    const dayWorkout = getWorkoutForDateKey(selectedKey);
    const fullLabel = mobileSelectedDate.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    let bodyHtml;
    if (!dayWorkout || !dayWorkout.parts || dayWorkout.parts.length === 0) {
      bodyHtml = `<div class="mobile-empty">No workout scheduled for ${fullLabel}</div>`;
    } else {
      bodyHtml = `
        <div class="mobile-workout-title">${escapeHtml(dayWorkout.title || "Workout")}</div>
        ${dayWorkout.parts.map((p, i) => `
          <div class="mobile-part">
            <div class="mobile-part-title">${escapeHtml(p.title)}</div>
            <div class="mobile-part-content">${escapeHtml(p.content || "—")}</div>
          </div>
          ${i < dayWorkout.parts.length - 1 ? '<div class="mobile-divider"></div>' : ""}
        `).join("")}
      `;
    }

    app.innerHTML = `
      <div class="mobile-shell">
        <div class="mobile-topbar">
          <span class="wordmark-mobile">VIVA <span class="accent">FITNESS</span></span>
        </div>
        <div class="week-nav">
          <button class="week-nav-btn" onclick="shiftMobileWeek(-7)" aria-label="Previous week">‹</button>
          <div class="week-strip">${dayCells}</div>
          <button class="week-nav-btn" onclick="shiftMobileWeek(7)" aria-label="Next week">›</button>
        </div>
        <div class="mobile-date-caption">${fullLabel}</div>
        <div class="mobile-workout-scroll">${bodyHtml}</div>
      </div>
    `;
  }

  window.selectMobileDate = function (key) {
    const [y, m, d] = key.split("-").map(Number);
    mobileSelectedDate = new Date(y, m - 1, d);
    buildMobile();
  };
  window.shiftMobileWeek = function (deltaDays) {
    mobileSelectedDate = addDays(mobileSelectedDate, deltaDays);
    buildMobile();
  };

  // Remote control scheme (registered once):
  //   No column chosen yet → Left/Right pick a count, OK confirms
  //   Left / Right  → switch focused column (or zoom it, if active)
  //   Up / Down     → change that column's piece (or scroll it, if active)
  //   OK / Enter (tap)   → activate/deactivate the focused column
  //   OK / Enter (hold)  → toggle dark / light mode
  let okHoldTimer = null;
  let okHoldFired = false;
  const OK_HOLD_MS = 600;

  document.addEventListener("keydown", (e) => {
    if (!workout) return;

    if (columnCount === null) {
      if (e.key === "ArrowRight") { e.preventDefault(); pickerSelection = clamp(pickerSelection + 1, 1, 4); renderPicker(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); pickerSelection = clamp(pickerSelection - 1, 1, 4); renderPicker(); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (e.repeat) return; confirmColumnCount(pickerSelection); }
      return;
    }

    if (!columns.length) return;
    const col = columns[focusedColumn];

    if (e.key === "ArrowRight") {
      e.preventDefault();
      if (col.active) {
        adjustZoom(focusedColumn, 1);
      } else {
        const tops = currentScrollTops();
        focusedColumn = clamp(focusedColumn + 1, 0, columnCount - 1);
        renderColumns();
        restoreScrollTops(tops);
      }
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      if (col.active) {
        adjustZoom(focusedColumn, -1);
      } else {
        const tops = currentScrollTops();
        focusedColumn = clamp(focusedColumn - 1, 0, columnCount - 1);
        renderColumns();
        restoreScrollTops(tops);
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (col.active) scrollColumnBy(focusedColumn, 90);
      else changePiece(focusedColumn, 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (col.active) scrollColumnBy(focusedColumn, -90);
      else changePiece(focusedColumn, -1);
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (e.repeat) return; // ignore key-repeat while held, we're timing this manually
      okHoldFired = false;
      clearTimeout(okHoldTimer);
      okHoldTimer = setTimeout(() => {
        okHoldFired = true;
        toggleTheme();
      }, OK_HOLD_MS);
    }
  });

  document.addEventListener("keyup", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      if (columnCount === null) return; // picker confirms on keydown directly, nothing to do here
      clearTimeout(okHoldTimer);
      if (!okHoldFired) toggleActiveColumn();
      okHoldFired = false;
    }
  });

  fetchSchedule();
  setInterval(fetchSchedule, POLL_INTERVAL_MS);

  // If the viewport crosses the mobile/desktop breakpoint while running
  // (e.g. resizing a browser window during testing), switch templates
  // live rather than waiting for the next poll.
  let lastViewportWasMobile = isMobileViewport();
  window.addEventListener("resize", () => {
    const nowMobile = isMobileViewport();
    if (nowMobile !== lastViewportWasMobile && (workout || fullSchedule)) {
      lastViewportWasMobile = nowMobile;
      renderForViewport();
    }
  });

  // ---------------------------------------------------------------
  // KEEP THE SCREEN AWAKE
  // Two independent mechanisms, since TV/OS support is inconsistent:
  //  1. Screen Wake Lock API (the modern, explicit way) — kept as a
  //     freebie, but Silk has been observed denying this outright.
  //  2. A real, small, genuinely-visible silent looping video. This
  //     replaces an earlier canvas.captureStream() version: Silk
  //     aborted that outright, and Chromium-based browsers deliberately
  //     refuse the "stay awake during playback" exemption for
  //     near-invisible/zero-size videos specifically to stop this kind
  //     of abuse — so the video needs to be real, decoded, and visible,
  //     just small and unobtrusive rather than hidden.
  // ---------------------------------------------------------------
  let wakeLock = null;
  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
    } catch (err) {
      console.warn("Wake Lock not granted:", err.message);
    }
  }

  function startKeepAwakeVideo() {
    const video = document.getElementById("keep-awake");
    video.play().catch((err) => {
      console.warn("Keep-awake video needs a nudge:", err.message);
      // Some browsers still block autoplay even for muted video until
      // a first user/remote interaction — retry on the first one.
      const retry = () => { video.play().catch(() => {}); };
      window.addEventListener("keydown", retry, { once: true });
      window.addEventListener("click", retry, { once: true });
    });
  }

  requestWakeLock();
  startKeepAwakeVideo();

  // Re-acquire both if the tab regains visibility/focus (some
  // platforms release the wake lock or pause video when backgrounded).
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      requestWakeLock();
      const video = document.getElementById("keep-awake");
      if (video && video.paused) video.play().catch(() => {});
    }
  });

  // Best-effort: ask for fullscreen so the browser's own chrome (URL
  // bar, tabs) gets out of the way. Most TV browsers require a user
  // gesture first, so this may silently no-op — that's fine, it's a
  // nice-to-have, not a requirement.
  document.addEventListener("click", () => {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }, { once: true });
</script>
</body>
</html>
